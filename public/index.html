<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WireGuard Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script src="socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>WireGuard Dashboard</h1>
        <p class="muted">Панель управления клиентами WireGuard</p>
      </div>
      <div class="topbar-actions">
        <button id="restart" class="button button-warning" type="button">Перезапустить WG</button>
        <button id="logout" class="button button-danger" type="button">Выйти</button>
      </div>
    </header>

    <section id="notice" class="notice" role="status" aria-live="polite" hidden></section>

    <section class="panel">
      <div class="toolbar">
        <button id="refresh" class="button button-secondary" type="button">Обновить</button>
        <input id="search" class="input" placeholder="Поиск по имени, IP или endpoint" autocomplete="off" />
      </div>
      <pre id="status" class="status-box">Статус появится после авторизации.</pre>
    </section>

    <section class="panel">
      <form id="add-form" class="add-form">
        <label class="field">
          <span>Имя клиента</span>
          <input id="name" class="input" placeholder="например, admin-phone" autocomplete="off" />
        </label>
        <div class="field checkbox-field">
          <span>Лимит</span>
          <label class="check-row">
            <input id="traffic-limit-enabled" type="checkbox" />
            <span>Включить лимит</span>
          </label>
        </div>
        <label class="field">
          <span>Объём</span>
          <input id="traffic-limit-value" class="input" placeholder="10 GB или 2048 MB" autocomplete="off" />
        </label>
        <button id="add" class="button button-primary" type="submit">Добавить</button>
      </form>
    </section>

    <section id="list" class="clients-list" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>

</html>
